services:
  api-administrative-authorization-language-courses-layered:
    image: api-administrative-authorization-language-courses-layered
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-administrative-authorization-language-courses-layered
    environment:
      POSTGRESQL_DB_USER: ${POSTGRESQL_DB_USER}
      POSTGRESQL_DB_PASSWORD: ${POSTGRESQL_DB_PASSWORD}
      POSTGRESQL_DB_NAME: ${POSTGRESQL_DB_NAME}
      POSTGRESQL_DB_HOST: db-postgresql
      POSTGRESQL_DB_PORT: ${POSTGRESQL_DB_PORT}
      MYSQL_DB_HOST: db-mysql
      MYSQL_DB_USER: ${MYSQL_DB_USER}
      MYSQL_DB_PASSWORD: ${MYSQL_DB_PASSWORD}
      MYSQL_DB_NAME: ${MYSQL_DB_NAME}
      MYSQL_DB_PORT: ${MYSQL_DB_PORT}
      PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
      #expose:
      #- "${PORT}:${PORT}"
    networks:
      - administrative-authorization-layered
    depends_on:
      db-mysql:
        condition: service_healthy
#      db-postgresql:
#        condition: service_healthy
    restart: on-failure

  db-mysql:
    image: mysql:latest
    container_name: academic-mysql
    restart: always
    ports:
      - "${MYSQL_DB_PORT}:${MYSQL_DB_PORT}"
#    expose:
#      - "${MYSQL_DB_PORT}:${MYSQL_DB_PORT}"
    networks:
      - administrative-authorization-layered
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASSWORD}
      #MYSQL_USER: ${USERNAME_DB}
      MYSQL_DATABASE: ${MYSQL_DB_NAME}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    volumes:
      - mysql:/var/lib/mysql

